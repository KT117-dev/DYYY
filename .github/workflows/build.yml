name: build release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: true
          fetch-depth: 0

      - name: Check cache
        run: |
          theos_head=$(git ls-remote https://github.com/roothide/theos HEAD | cut -f 1)
          sdk_head=$(git ls-remote https://github.com/theos/sdks HEAD | cut -f 1)
          echo "upstream_heads=${theos_head}-${sdk_head}" >> "$GITHUB_ENV"

      - name: Use cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Remove unused Homebrew taps
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTOREMOVE: "1"
        run: |
          if brew list --formula | grep -Fxq "bicep"; then
            brew uninstall --formula --ignore-dependencies bicep
          fi
          for tap in aws/tap azure/bicep; do
            if brew tap | grep -Fxq "$tap"; then
              brew untap "$tap"
            fi
          done

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Clean packages dir
        run: rm -rf packages && mkdir -p packages
        
      - name: Build Rootful
        run: |
          make clean
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            if [[ "$f" != *-root*.deb ]]; then
              mv "$f" "${f%.deb}-rootful.deb"
            fi
          done
             
      - name: Build Rootless
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            if [[ "$f" != *-root*.deb ]]; then
              mv "$f" "${f%.deb}-rootless.deb"
            fi
          done
          
      - name: Build Roothide
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            if [[ "$f" != *-root*.deb ]]; then
              mv "$f" "${f%.deb}-roothide.deb"
            fi
          done
          
      - name: Prepare package metadata
        id: package
        run: |
          timestamp=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          version=$(awk -F': ' '$1 == "Version" { print $2; exit }' control)
          if [ -z "$version" ]; then
            echo "Unable to read package version from control" >&2
            exit 1
          fi
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Deb packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          deb_files=(packages/*.deb)
          if [ "${#deb_files[@]}" -ne 3 ]; then
            echo "Expected 3 Deb packages, found ${#deb_files[@]}:" >&2
            printf '  %s\n' "${deb_files[@]}" >&2
            exit 1
          fi

          for scheme in rootful rootless roothide; do
            scheme_files=(packages/*-"${scheme}".deb)
            if [ "${#scheme_files[@]}" -ne 1 ]; then
              echo "Expected exactly one ${scheme} package, found ${#scheme_files[@]}" >&2
              exit 1
            fi
          done

          printf 'Package artifact: %s\n' "${deb_files[@]}"

      - name: Extract arm64e dylib
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          SOURCE_DEB_GLOB: packages/*-roothide.deb
          FALLBACK_DEB_GLOB: ''
        run: .github/scripts/extract-release-dylib.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-${{ steps.package.outputs.timestamp }}
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.dylib

      - name: Upload assets to the published Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" packages/*.deb packages/*.dylib \
            --repo "$GITHUB_REPOSITORY" --clobber
